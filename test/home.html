<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN homepage v3 harness (hero quiz, member wins, starter set)</title>
<style>
  /* Mimics the Kajabi Encore wrapper: body overflow-x hidden, .container > .row > .col-12, section padding. */
  body{margin:0;overflow-x:hidden;font-family:'Open Sans',system-ui,sans-serif;background:#fff}
  .section{padding:64px 24px}
  .container{max-width:1200px;margin:0 auto}
  .row{display:flex}.col-12{width:100%}
  .fakehdr{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 24px;color:#1A1F2C;font-weight:700;z-index:5}
</style>
</head>
<body>
<div class="fakehdr">creatoraccessnetwork.com (header overlay stand-in)</div>
<div id="mount-home"></div>
<script>
/* Loads scripts/payloads/home-v3.json (built by scripts/build_home_v3.py) and renders its code blocks in render order,
   substituting the local repo for the GitHub Pages base so can-quiz.js / can-testimonials.js are the working copies. */
(function () {
  var BASE = "https://creatoraccessnetwork.github.io/can-widget/";
  var LOCAL = location.href.replace(/test\/[^/]*$/, "");
  fetch("../scripts/payloads/home-v3.json").then(function (r) { return r.json(); }).then(function (p) {
    var order = p.content_for_index.filter(function (id) { return id && p.sections[id] && p.sections[id].blocks && p.sections[id].hidden !== "true"; });
    var PAT = { "1787360000001": 1, "1787360000003": 1, "1787360000004": 1, "1787360000005": 1 };
    var host = document.getElementById("mount-home");
    order.forEach(function (id) {
      var s = p.sections[id], pad = (s.settings && s.settings.padding_desktop) || { top: 64, right: 24, bottom: 64, left: 24 };
      var sec = document.createElement("div"); sec.className = "section"; sec.id = "section-" + id;
      sec.style.padding = pad.top + "px " + pad.right + "px " + pad.bottom + "px " + pad.left + "px";
      if (PAT[id]) { sec.style.background = "#F0F4F8 url(../can-pattern-v4-desktop.svg) repeat"; sec.style.backgroundSize = "970px 970px"; }
      var col = document.createElement("div"); col.className = "col-12";
      (s.block_order || Object.keys(s.blocks)).forEach(function (bid) {
        var b = s.blocks[bid];
        if (b.type === "form") {
          var f = document.createElement("form"); f.innerHTML = '<div class="form-group"><input type="email" placeholder="Email"></div><button type="button" class="btn">' + b.settings.btn_text + '</button>';
          col.appendChild(f); return;
        }
        var html = b.settings.code.split(BASE).join(LOCAL);
        var tmp = document.createElement("div"); tmp.innerHTML = html;
        Array.prototype.slice.call(tmp.childNodes).forEach(function (n) {
          if (n.tagName === "SCRIPT") { var sc = document.createElement("script"); if (n.src) sc.src = n.src; else sc.textContent = n.textContent; col.appendChild(sc); }
          else col.appendChild(n);
        });
      });
      var row = document.createElement("div"); row.className = "row"; row.appendChild(col);
      var c = document.createElement("div"); c.className = "container"; c.appendChild(row);
      sec.appendChild(c); host.appendChild(sec);
    });
  });
})();
</script>
</body>
</html>
