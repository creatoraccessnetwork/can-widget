<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN offer page harness (hero v3 Unlock Access + Member Wins + fake checkout)</title>
<style>
  body{margin:0;overflow-x:hidden;font-family:'Open Sans',system-ui,sans-serif;background:#F0F4F8 url('../can-pattern-v4-desktop.svg') repeat;background-size:970px 970px}
  .section{padding:64px 24px}.container{max-width:1200px;margin:0 auto}.row{display:flex}.col-12{width:100%}
  #section-1744906803654{background:#fff}
  .fakeco{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:7fr 5fr;gap:24px}
  .fakeco .box{background:#fff;border:1px solid #E6EBF2;border-radius:4px;box-shadow:0 3px 10px rgba(26,31,44,.1);padding:24px}
  .fakeco input{width:100%;height:44px;border:1px solid #E6EBF2;border-radius:4px;padding:0 12px;font:inherit}
</style>
</head>
<body>
<div id="mount"></div>
<script>
/* ?cfg=newsletter (default) | beehiiv ... Renders the hero payload from scripts/payloads/offer-hero-v3/<cfg>.json,
   the Member Wins block, and a stand-in Kajabi checkout section with an email input (to test the scroll + prefill). */
(function () {
  var BASE = "https://creatoraccessnetwork.github.io/can-widget/", LOCAL = location.href.replace(/test\/[^/]*$/, "");
  var cfg = (location.search.match(/cfg=([a-z0-9]+)/) || [])[1] || "newsletter";
  var host = document.getElementById("mount");
  function addSection(id, html, pad) {
    var sec = document.createElement("div"); sec.className = "section"; sec.id = "section-" + id; if (pad) sec.style.padding = pad;
    var col = document.createElement("div"); col.className = "col-12";
    var tmp = document.createElement("div"); tmp.innerHTML = html.split(BASE).join(LOCAL);
    Array.prototype.slice.call(tmp.childNodes).forEach(function (n) {
      if (n.tagName === "SCRIPT") { var sc = document.createElement("script"); if (n.src) sc.src = n.src; else sc.textContent = n.textContent; col.appendChild(sc); } else col.appendChild(n);
    });
    var row = document.createElement("div"); row.className = "row"; row.appendChild(col);
    var c = document.createElement("div"); c.className = "container"; c.appendChild(row); sec.appendChild(c); host.appendChild(sec);
  }
  Promise.all([fetch("../scripts/payloads/offer-hero-v3/" + cfg + ".json").then(function (r) { return r.json(); }),
               fetch("../scripts/payloads/offer-wins/" + cfg + ".json").then(function (r) { return r.json(); })]).then(function (r) {
    var hero = r[0].settings.sections["1787370000000"], wins = r[1].settings.sections["1787370000012"];
    addSection("1787370000000", hero.blocks["1787370000000_0"].settings.code, "72px 24px 64px");
    addSection("1787370000012", wins.blocks["1787370000012_0"].settings.code, "56px 24px 48px");
    addSection("1744906803654", '<div class="fakeco"><div class="box"><h2>Included with your membership</h2><p>(stand-in for the Kajabi text block)</p></div><div class="box"><h3>Checkout (stand-in)</h3><label>Email<input type="email" placeholder="Email"></label></div></div>');
  });
})();
</script>
</body>
</html>
