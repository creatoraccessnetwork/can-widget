<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN widget - test harness</title>
<style>body{margin:0;font-family:sans-serif}h4{margin:24px 16px 8px;color:#555}</style>

<h4>Default (homepage-style)</h4>
<div id="cansw-mount"></div>
<script>
/* Test configs:
   ?test=demote   - co-brand page using the NEW demotePartners key + topPicks
   ?test=picks    - co-brand page with topPicks and NO explicit demote (beehiiv
                    spec: auto shared-category demotion does all the work)
   ?test=legacy   - co-brand page using the DEPRECATED hidePartners alias
   ?test=cobrand  - photo co-brand + "#" joinUrl (scroll to checkout)
   ?test=unlink   - unlinkCtas preview surface */
var q = new URLSearchParams(location.search).get('test');
if (q === 'demote') {
  window.CANSW_OVERRIDES = {
    defaultCategory: 'All categories',
    captureTag: 'cobrand-thematic',
    captureUrl: 'https://www.creatoraccessnetwork.com/forms/2149650486/form_submissions',
    demotePartners: ["Slipstream", "Epidemic Sound"],
    topPicks: ["Buy.Video", "Elevate.io", "EditHers", "Insense", "Mercury", "Wispr Flow"],
    cobrand: { mode: "logo",
      image: "https://cdn.commoninja.com/asset/f42e7860-717e-4a27-a3e8-2714a8152586.png",
      name: "Thematic", title: "Real artists' music for your content" }
  };
} else if (q === 'picks') {
  window.CANSW_OVERRIDES = {
    topPicks: ["Growth in Reverse", "Creator Wizard", "Pop.store", "Wispr Flow", "Mercury"],
    cobrand: { mode: "logo",
      image: "https://cdn.commoninja.com/asset/17226348-3ca7-4837-9a75-9f863e05dad5.png",
      name: "beehiiv", title: "The newsletter platform built for growth" }
  };
} else if (q === 'legacy') {
  window.CANSW_OVERRIDES = {
    hidePartners: ["Kajabi", "Teachable", "Nas.com"],
    cobrand: { mode: "logo",
      image: "https://cdn.commoninja.com/asset/f42e7860-717e-4a27-a3e8-2714a8152586.png",
      name: "Mighty Networks", title: "Community platform" }
  };
} else if (q === 'cobrand') {
  window.CANSW_OVERRIDES = {
    defaultCategory: "Newsletter", joinUrl: "#section-checkout", dealsUrl: "",
    cobrand: { mode: "photo",
      image: "https://lh3.googleusercontent.com/d/1OJp9mL7J-kExivS8QSghWFKXYN-A2VVi",
      name: "Rahim Jessani", title: "Founder, Bottom Up Media",
      headline: "The tools I'd hand every Creator journalist" }
  };
} else if (q === 'capture') {
  /* capture endpoint set AND a "#" joinUrl, so the submit path can be
     exercised without navigating away from the harness */
  window.CANSW_OVERRIDES = {
    joinUrl: '#section-checkout',
    captureTag: 'test-harness',
    captureUrl: 'https://www.creatoraccessnetwork.com/forms/2149650486/form_submissions'
  };
} else if (q === 'unlink') {
  window.CANSW_OVERRIDES = { unlinkCtas: true };
}
</script>
<script src="cansw.js"></script>
<div id="section-checkout" style="height:400px;background:#fff;padding:40px">
  <h3>Embedded checkout (scroll target for "#" joinUrl)</h3>
</div>
